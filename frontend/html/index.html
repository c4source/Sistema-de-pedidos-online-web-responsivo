<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Pizzaria MVP</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Pizzaria MVP</h1>
    </header>

    <main class="menu-screen">
      <section class="search-section" aria-label="Busca visual do cardápio">
        <input class="search-box" id="search-input" type="search" placeholder="Buscar produto..." aria-label="Buscar produto">
      </section>

      <section class="filter-section" aria-label="Categorias do cardápio">
        <div class="filter-list">
          <button class="filter-chip" type="button" data-category="pizza">Pizza</button>
          <button class="filter-chip" type="button" data-category="bebida">Bebida</button>
          <button class="filter-chip" type="button" data-category="combo">Combo</button>
        </div>
      </section>

      <section class="product-section" id="product-section" aria-label="Lista de produtos"></section>
    </main>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
