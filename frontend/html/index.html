<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cardápio | Pizzaria MVP</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Pizzaria MVP</h1>
    </header>

    <main class="menu-screen">
      <section class="search-section" aria-label="Busca visual do cardápio">
        <div class="search-box">Buscar Pizza...</div>
      </section>

      <section class="filter-section" aria-label="Categorias do cardápio">
        <div class="filter-list">
          <button class="filter-chip" type="button">Pizza</button>
          <button class="filter-chip" type="button">Bebida</button>
          <button class="filter-chip" type="button">Combo</button>
        </div>
      </section>

      <section class="product-section" aria-label="Lista de produtos">
        <article class="product-card" data-link="detalhe.html">
          <div class="product-image" aria-hidden="true">IMG</div>
          <h2 class="product-name">Pizza Calabresa</h2>
          <p class="product-price">R$ 39,90</p>
          <button class="add-button" type="button">Adicionar</button>
        </article>

        <article class="product-card" data-link="detalhe.html">
          <div class="product-image" aria-hidden="true">IMG</div>
          <h2 class="product-name">Pizza Frango</h2>
          <p class="product-price">R$ 39,90</p>
          <button class="add-button" type="button">Adicionar</button>
        </article>

        <article class="product-card" data-link="detalhe.html">
          <div class="product-image" aria-hidden="true">IMG</div>
          <h2 class="product-name">Pizza 4 Queijos</h2>
          <p class="product-price">R$ 39,90</p>
          <button class="add-button" type="button">Adicionar</button>
        </article>
      </section>
    </main>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>
